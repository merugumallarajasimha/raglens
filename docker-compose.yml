version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: raglens_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglens}
      POSTGRES_DB: ${POSTGRES_DB:-raglens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raglens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: raglens_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  qdrant_data:
